# TriCoach 3 (Flutter + Supabase): prüft Backend und App bei jedem Push auf den Branch flutter-app.
# Jeder Lauf legt einen lesbaren Bericht in die Branches ci-bericht-app / ci-bericht-android
# (Analyse, Tests, Build-Ausgabe) – praktisch, um Fehler ohne GitHub-Oberfläche nachzulesen.
name: App (Flutter)
on:
  push:
    branches: [flutter-app]
    paths: ['app/**', 'supabase/**', '.github/workflows/app.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend (Datenbank + Kalender)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kalender-Datei (.ics) testen
        run: node supabase/tests/ics.test.mjs
      - name: Datenmodell + Zugriffsregeln testen
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/run.sh

  app:
    name: App (analysieren, testen, Web bauen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: mkdir -p ../ci-out && flutter --version | tee ../ci-out/0-flutter-version.txt
      - name: Pakete laden
        run: flutter pub get 2>&1 | tee ../ci-out/1-pub-get.txt
      - name: Paketstände
        run: (flutter pub deps --style=compact; echo; flutter pub outdated) > ../ci-out/2-pakete.txt 2>&1 || true
      - name: Code prüfen
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-out/3-analyse.txt
      - name: Tests
        id: test
        continue-on-error: true
        run: flutter test --reporter expanded --timeout 3m 2>&1 | tee ../ci-out/4-tests.txt
      - name: Web-Version bauen
        id: web
        continue-on-error: true
        run: flutter build web --release --no-web-resources-cdn --base-href /tricoach/v3/ --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }} 2>&1 | tail -150 | tee ../ci-out/5-web-build.txt
      - uses: actions/upload-artifact@v4
        if: steps.web.outcome == 'success'
        with:
          name: tricoach-web
          path: app/build/web
          retention-days: 14
      - name: Web-Version veröffentlichen (jannikbuhlrich-hue.github.io/tricoach/v3/)
        # Nur wenn Tests und Build grün sind. Landet im Ordner v3/ auf main – die Web-App 2.x im Hauptordner bleibt unberührt.
        if: steps.web.outcome == 'success' && steps.test.outcome == 'success' && github.ref == 'refs/heads/flutter-app'
        run: |
          d=$(mktemp -d)
          git clone -q --depth 1 --branch main "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$d"
          rm -rf "$d/v3" && mkdir -p "$d/v3" && cp -r build/web/. "$d/v3/"
          cd "$d"
          git add -A v3
          if git diff --cached --quiet; then echo "Web-Version unverändert"; exit 0; fi
          git -c user.name="TriCoach Bot" -c user.email="tricoach-bot@users.noreply.github.com" commit -qm "Web-Version 3 veröffentlicht (${GITHUB_SHA::7})"
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
      - name: Bericht ablegen
        if: always()
        run: |
          printf 'commit %s\nanalyse %s\ntests %s\nweb %s\n' "${{ github.sha }}" "${{ steps.analyze.outcome }}" "${{ steps.test.outcome }}" "${{ steps.web.outcome }}" > ../ci-out/status.txt
          d=$(mktemp -d); cp -r ../ci-out/. "$d"; cd "$d"
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@tricoach.app commit -qm "App-Bericht ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-bericht-app
      - name: Ergebnis
        run: '[ "${{ steps.analyze.outcome }}" = success ] && [ "${{ steps.test.outcome }}" = success ] && [ "${{ steps.web.outcome }}" = success ]'

  android:
    name: Android (Test-App bauen)
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android-App bauen (Debug-APK)
        id: apk
        continue-on-error: true
        run: |
          mkdir -p ../ci-out
          flutter build apk --debug --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }} > ../ci-out/apk-build.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: steps.apk.outcome == 'success'
        with:
          name: tricoach-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Bericht ablegen
        if: always()
        run: |
          printf 'commit %s\napk %s\n' "${{ github.sha }}" "${{ steps.apk.outcome }}" > ../ci-out/status.txt
          tail -250 ../ci-out/apk-build.txt > ../ci-out/apk-build-ende.txt || true
          d=$(mktemp -d); cp -r ../ci-out/. "$d"; cd "$d"
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@tricoach.app commit -qm "Android-Bericht ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-bericht-android
      - name: Ergebnis
        run: '[ "${{ steps.apk.outcome }}" = success ]'

  ios:
    name: iOS (bauen ohne Signatur)
    needs: app
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iOS-App bauen (ohne Signatur)
        id: ios
        continue-on-error: true
        run: |
          mkdir -p ../ci-out
          flutter build ios --no-codesign --debug --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }} > ../ci-out/ios-build.txt 2>&1
      - name: Bericht ablegen
        if: always()
        run: |
          printf 'commit %s\nios %s\n' "${{ github.sha }}" "${{ steps.ios.outcome }}" > ../ci-out/status.txt
          tail -250 ../ci-out/ios-build.txt > ../ci-out/ios-build-ende.txt || true
          d=$(mktemp -d); cp -r ../ci-out/. "$d"; cd "$d"
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@tricoach.app commit -qm "iOS-Bericht ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-bericht-ios
      - name: Ergebnis
        run: '[ "${{ steps.ios.outcome }}" = success ]'
