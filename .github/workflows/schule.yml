# TriCoach – holt alle 30 Minuten (6–22 Uhr) deinen WebUntis-Stundenplan mit Ausfall, Vertretung,
# Hausaufgaben und Prüfungen, verschlüsselt ihn und legt ihn in den Branch „schule-daten“.
# Lesen kann die Datei nur deine TriCoach-App mit deinem Schlüssel. Einrichtung: TriCoach → Einstellungen → Schule.
# Nötig ist nur das Secret TRICOACH_KEY, wenn tools/untis-zugang.enc im Repo liegt – sonst zusätzlich UNTIS_ZUGANG (siehe tools/untis-sync.mjs).
name: Schule (WebUntis)
on:
  schedule:
    - cron: '7,37 4-20 * * *'   # UTC = 6–22 Uhr deutscher Zeit (Sommer), 5–21 Uhr (Winter)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schule
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: WebUntis abrufen und verschlüsseln
        env:
          UNTIS_ZUGANG: ${{ secrets.UNTIS_ZUGANG }}
          UNTIS_SERVER: ${{ secrets.UNTIS_SERVER }}
          UNTIS_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_KEY: ${{ secrets.UNTIS_KEY }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          TRICOACH_KEY: ${{ secrets.TRICOACH_KEY }}
        run: node tools/untis-sync.mjs out/schule.enc
      - name: Verschlüsselte Datei veröffentlichen
        if: hashFiles('out/schule.enc') != ''
        run: |
          cd out
          git init -q -b schule-daten
          git config user.name "TriCoach Bot"
          git config user.email "tricoach-bot@users.noreply.github.com"
          git add schule.enc
          git commit -q -m "Schuldaten aktualisiert"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" schule-daten
