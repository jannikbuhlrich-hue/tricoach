# XcodeGen-Projektdefinition → `brew install xcodegen && xcodegen generate`
name: TriCoach
options:
  bundleIdPrefix: de.tricoach
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # eigenes Team eintragen

targets:
  TriCoach:
    type: application
    platform: iOS
    sources:
      - path: TriCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tricoach.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: TriCoach/TriCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: development
    info:
      path: TriCoach/Info.plist
      properties:
        CFBundleDisplayName: TriCoach
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - de.tricoach.refresh
        CFBundleURLTypes:
          - CFBundleURLName: de.tricoach.app
            CFBundleURLSchemes: [tricoach]
        NSHealthShareUsageDescription: TriCoach liest Workouts, Herzfrequenz, HRV, Schlaf und VO2max, um dein Triathlon-Training zu analysieren.
        NSHealthUpdateUsageDescription: TriCoach kann geplante Workouts in Apple Health speichern.
        NSCalendarsFullAccessUsageDescription: TriCoach trägt geplante Trainingseinheiten in deinen Kalender „TriCoach“ ein.
        GARMIN_CLIENT_ID: $(GARMIN_CLIENT_ID)
        TRICOACH_BACKEND_URL: $(TRICOACH_BACKEND_URL)

  TriCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TriCoachTests
    dependencies:
      - target: TriCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tricoach.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TriCoach:
    build:
      targets:
        TriCoach: all
        TriCoachTests: [test]
    test:
      targets:
        - TriCoachTests
